edition = "2024"

[dependencies]
zerocopy = {version="0.8.56", features=["derive"]}

[target.'cfg(windows)'.dependencies]
windows = { version = ">= 0.59, <=0.62", features = ["Data_Xml_Dom",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",] }