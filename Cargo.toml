[package]
name = "CoyoteDB"
version = "0.1.0"
edition = "2024"

[dependencies]
textnonce = "1.0.0"
zerocopy = {version="0.8.56", features=["derive"]}

[target.'cfg(windows)'.dependencies]
windows = { version = ">= 0.59, <=0.62", features = [
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_TpmBaseServices"] }
